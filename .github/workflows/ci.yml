name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ruby and dependencies
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          bundler-cache: true
          ruby-version: "4.0"
      - name: Install shfmt
        run: sudo apt-get install shfmt
      - run: make lint-scripts
      - run: make check-format
      - run: make lint-ruby

  hatchet:
    name: "Hatchet (${{ matrix.stack }})"
    runs-on: ubuntu-22.04
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        stack: ["heroku-22", "heroku-24", "heroku-26"]
    env:
      HATCHET_APP_LIMIT: 100
      HATCHET_RUN_MULTI: 1
      HATCHET_EXPENSIVE_MODE: 1
      PARALLEL_SPLIT_TEST_PROCESSES: 6
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_API_USER: ${{ secrets.HEROKU_API_USER }}
      HEROKU_DISABLE_AUTOUPDATE: 1
      # TODO: Remove once Hatchet supports GitHub Actions natively:
      # https://github.com/heroku/hatchet/pull/189
      HATCHET_BUILDPACK_BRANCH: ${{ github.head_ref || github.ref_name }}
      HATCHET_BUILDPACK_BASE: https://github.com/heroku/heroku-buildpack-scala
      # Default stack for all Heroku apps created by Hatchet
      DEFAULT_APP_STACK: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ruby and dependencies
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          bundler-cache: true
          ruby-version: "4.0"
      - name: Hatchet setup
        run: bundle exec hatchet ci:setup
      - name: Run Hatchet integration tests
        run: bundle exec parallel_split_test test/spec/
